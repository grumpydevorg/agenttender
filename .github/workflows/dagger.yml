name: dagger

# PILOT (docs/plans/active/03_dagger-ci.md): the Linux jobs of ci.yml, run as
# Dagger checks ALONGSIDE ci.yml to measure overhead and verify equivalence.
# Nothing here is a required check, and ci.yml stays the gate.
#
# One job per ci.yml Linux job, on the same runner type, so the per-job
# difference is Dagger's own cost. Hosted runners keep no Dagger state between
# runs, so every run here is cold -- as is every ci.yml run (no cargo cache).
#
# Dagger Cloud is off and proven off: no token is passed, and the CLI runs in
# a container with no network route (.github/dagger-sandboxed.sh).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dagger-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DAGGER_VERSION: "0.21.9"
  DAGGER_BIN: ${{ github.workspace }}/../dagger-bin/dagger

jobs:
  check:
    name: dagger ${{ matrix.lane }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: lint, checks: "fmt clippy package" }
          - { lane: doc, checks: "doc" }
          - { lane: msrv, checks: "msrv" }
          - { lane: test, checks: "test" }
          - { lane: clippy-windows, checks: "clippy-windows" }
    steps:
      - uses: actions/checkout@v7

      # The pinned release tarball, verified against the release's checksums,
      # instead of dagger-for-github: that action's `cloud-token` input
      # overrides any job-level token, and it cannot run the CLI sandboxed.
      - name: Install dagger CLI
        run: |
          dir=$(dirname "$DAGGER_BIN"); mkdir -p "$dir"; cd "$dir"
          base="https://github.com/dagger/dagger/releases/download/v${DAGGER_VERSION}"
          tarball="dagger_v${DAGGER_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar xzf "$tarball" dagger

      - name: Pull images
        run: |
          docker pull -q "registry.dagger.io/engine:v${DAGGER_VERSION}"
          docker pull -q docker:29.4.0-cli

      - name: Prove the CLI sandbox has no route
        run: |
          if docker run --rm --network none docker:29.4.0-cli \
               wget -q -T 5 -O /dev/null https://api.dagger.cloud; then
            echo "::error::the --network none sandbox reached api.dagger.cloud"
            exit 1
          fi
          echo "no route out of the sandbox, as intended"

      # Every dagger invocation appends to one log, which the last step
      # inspects for any sign of Dagger Cloud.
      - name: Start engine
        run: |
          set -o pipefail
          echo '{ version }' | .github/dagger-sandboxed.sh query 2>&1 | tee -a "$RUNNER_TEMP/dagger.log"

      - name: Load module
        run: |
          set -o pipefail
          .github/dagger-sandboxed.sh check -l 2>&1 | tee -a "$RUNNER_TEMP/dagger.log"

      - name: Checks (${{ matrix.checks }})
        run: |
          set -o pipefail
          .github/dagger-sandboxed.sh --progress=plain check ${{ matrix.checks }} 2>&1 \
            | tee -a "$RUNNER_TEMP/dagger.log"

      - name: Assert no Dagger Cloud trace
        if: always()
        run: |
          log="$RUNNER_TEMP/dagger.log"
          test -s "$log" || { echo "::error::no dagger log to inspect"; exit 1; }
          # An uploaded trace prints "Full trace at https://dagger.cloud/...".
          if grep -q 'Full trace at' "$log"; then
            echo "::error::a Dagger Cloud trace was uploaded"; exit 1
          fi
          # Without a token the CLI nags to set tracing up: positive evidence
          # that no trace export was configured.
          if grep -q 'Setup tracing at' "$log"; then
            echo "tracing not configured, as intended"
          else
            echo "::warning::no 'Setup tracing' notice; check the CLI's tracing state"
          fi
